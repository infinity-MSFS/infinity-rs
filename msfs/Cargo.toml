[package]
name = "infinity-rs"
version = "0.2.0"
edition = "2024"
description = "Safe, idiomatic Rust bindings for the MSFS 2024 WASM SDK."

[features]
default = []
# Enable SimConnect bindings and linking (Windows only; requires the full MSFS SDK).
simconnect = []

[dependencies]
msfs_derive = { path = "../msfs_derive" }
bitflags = "1.3"
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
bindgen = "0.72"
msfs_sdk = { path = "../msfs_sdk" }
cc = "1.0"
