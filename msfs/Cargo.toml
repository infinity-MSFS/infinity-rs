[package]
name = "infinity-rs"
version = "0.2.0"
edition = "2024"
description = "Safe, idiomatic Rust bindings for the MSFS 2024 WASM SDK."

[features]
default = ["wasm"]
# Compile the MSFS WASM-runtime APIs (nvg, vfx, map view, comm bus, flow, io,
# network, charts, planned route, events, vars, gauge/system entry points,
# prelude). These call into symbols only provided by the MSFS WASM host, so
# disable this feature for native builds.
wasm = []
# Enable SimConnect bindings. Works on both WASM (resolved by the host
# runtime) and native Windows (linked against the SimConnect import lib).
simconnect = []

[dependencies]
msfs_derive = { path = "../msfs_derive" }
bitflags = "1.3"
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
bindgen = "0.72"
msfs_sdk = { path = "../msfs_sdk" }
cc = "1.0"

[[example]]
name = "simconnect_native"
required-features = ["simconnect"]

[[example]]
name = "simconnect_gauge"
required-features = ["simconnect"]
crate-type = ["cdylib"]

[[example]]
name = "charts_gauge"
crate-type = ["cdylib"]

